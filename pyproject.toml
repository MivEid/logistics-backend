[project]
name = "logistics"
version = "0.1.0"
description = "Logistics/Delivery Management System — Backend Project 2026"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.21.0",
    "alembic>=1.18.4",
    "fastapi>=0.116.1",
    "fastapi-filter[sqlalchemy]>=2.0.1",
    "fastapi-pagination>=0.15.12",
    "pydantic-settings>=2.10.1",
    "pydantic[email]>=2.11.7",
    "python-multipart>=0.0.22",
    "sqlalchemy[asyncio]>=2.0.43",
    "uvicorn[standard]>=0.35.0",
    "fastapi-users[sqlalchemy]>=13.0.0",
    "aiosmtplib>=3.0.0",
    "asyncpg>=0.31.0",
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.30.0",
]
